databases:
  - name: anvil-db
    databaseName: anvil
    user: anvil
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    runtime: docker
    name: anvil-app
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    preDeployCommand: node db/migrate.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anvil-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
